<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>90-Day Discipline Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Tiro+Devanagari+Sanskrit&family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <!-- Setup Screen -->
        <section id="setup-screen" class="screen hidden">
            <div class="glass-card">
                <h1>ಶುಭಾರಂಭ 🙏</h1>
                <p>Configure your 90-Day Discipline Journey.</p>
                
                <label>Start Date</label>
                <input type="date" id="setup-start-date">
                
                <label>Wake-up Target</label>
                <input type="time" id="setup-wake-target" value="04:00">
                
                <label>Nyaya Text Name</label>
                <input type="text" id="setup-nyaya-text" placeholder="e.g., Tarkasangraha">
                
                <label>Mimamsa Text Name</label>
                <input type="text" id="setup-mimamsa-text" placeholder="e.g., Arthasangraha">
                
                <label>Personal Goal</label>
                <textarea id="setup-goal" placeholder="What kind of person will you become?"></textarea>
                
                <button id="btn-start-journey" class="primary-btn">Start 90-Day Journey</button>
            </div>
        </section>

        <!-- Main Dashboard -->
        <section id="dashboard-screen" class="screen hidden">
            <header class="dashboard-header glass-card">
                <div class="greeting">
                    <h2 id="greeting-text">ಶುಭಪ್ರಭಾತ 🙏</h2>
                    <p id="day-counter" class="day-counter">Day <span id="current-day">1</span> of 90</p>
                </div>
                <div id="motivational-message" class="motivational-quote"></div>
                <div id="recovery-message" class="recovery-indicator hidden"></div>
            </header>

            <div class="stats-row">
                <div class="stat-card glass-card">
                    <span class="stat-value" id="current-streak">0</span>
                    <span class="stat-label">Day Streak 🔥</span>
                </div>
                <div class="stat-card glass-card">
                    <span class="stat-value" id="habits-completed">0/0</span>
                    <span class="stat-label">Habits Today</span>
                </div>
            </div>

            <div class="controls glass-card">
                <label class="toggle-switch">
                    <input type="checkbox" id="busy-day-toggle">
                    <span class="slider"></span>
                </label>
                <span>Busy Day Mode <small>(Protects minimum essential habits)</small></span>
            </div>

            <div id="habits-container" class="habits-list">
                <!-- Habits injected via JavaScript -->
            </div>
            
            <button id="btn-save-day" class="primary-btn mt-2">Save Today's Progress</button>
        </section>

        <!-- Navigation -->
        <nav class="bottom-nav glass-card">
            <button class="nav-btn active" data-target="dashboard-screen">Daily</button>
            <button class="nav-btn" data-target="study-screen">Study</button>
            <button class="nav-btn" data-target="settings-screen">Settings</button>
        </nav>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
